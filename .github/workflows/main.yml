name: Build & Deploy

on:
  push:
    branches: [ "main" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY: docker.io
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    #  Login DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 🐳 Build AUTH
    - name: Build & Push Auth
      run: |
        docker build -f auth/Dockerfile -t $IMAGE_AUTH:${{ github.sha }} ./auth
        docker push $IMAGE_AUTH:${{ github.sha }}

    # 🐳 Build POST
    - name: Build & Push Post
      run: |
        docker build -f post/Dockerfile -t $IMAGE_POST:${{ github.sha }} ./post
        docker push $IMAGE_POST:${{ github.sha }}

    # ✏️ Update K8s manifests
    - name: Update image tags
      run: |
        sed -i "s|image: .*auth.*|image: $IMAGE_AUTH:${{ github.sha }}|" k8s/auth/deployment.yaml
        sed -i "s|image: .*post.*|image: $IMAGE_POST:${{ github.sha }}|" k8s/post/deployment.yaml

    # 📤 Push changes (GitOps trigger)
    - name: Commit & Push
      run: |
        git config --global user.name "ci-bot"
        git config --global user.email "ci@bot.com"
        git commit -am "Update images to ${{ github.sha }}"
        git push
