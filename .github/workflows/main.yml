name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build images
        run: |
          docker build -t myrepo/auth:${{ github.sha }} ./auth
          docker push myrepo/auth:${{ github.sha }}

      - name: Update k8s
        run: |
          sed -i "s/tag:.*/tag: ${{ github.sha }}/" k8s/auth/deployment.yaml
          git commit -am "update image"
          git push
